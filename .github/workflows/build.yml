name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: libipsec

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build with GNU Make
        run: |
          make -C ipsec clean_host
          make -C ipsec host -j"$(nproc)"
          make -C apps clean_host
          make -C apps host -j"$(nproc)"
      - name: Build and test with CMake
        run: ./ipsec/cmake_build.sh host

  aarch64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install AArch64 compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile with GNU Make
        run: |
          make -C ipsec clean_zynqmp
          make -C ipsec zynqmp -j"$(nproc)" \
            CROSS_COMPILE=aarch64-linux-gnu-
          make -C apps clean_zynqmp
          make -C apps zynqmp -j"$(nproc)"
      - name: Cross-compile with CMake
        run: BUILD_TESTING=OFF ./ipsec/cmake_build.sh zynqmp
      - name: Verify architecture
        run: |
          aarch64-linux-gnu-readelf -h lib/zynqmp/libipsec.so | grep AArch64
          aarch64-linux-gnu-readelf -h build/zynqmp/libipsec.so | grep AArch64
