name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: libipsec

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with GNU Make
        run: |
          make -C ipsec clean_host
          make -C ipsec host -j"$(nproc)"
          make -C apps clean_host
          make -C apps host -j"$(nproc)"
      - name: Build and test with CMake
        run: |
          cmake -S ipsec -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --parallel "$(nproc)"
          ctest --test-dir build/cmake --output-on-failure

  aarch64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile with GNU Make
        run: |
          ./scripts/build_aarch64.sh
          make -C apps clean_zynqmp
          make -C apps zynqmp -j"$(nproc)"
      - name: Verify architecture
        run: aarch64-linux-gnu-readelf -h lib/zynqmp/libipsec.so | grep AArch64
